# =============================================================================
# Mosquitto Fuzzing Configuration
# =============================================================================
# Disables authentication and enables verbose logging for maximum fuzz coverage.
# All security features are intentionally turned off — this is a fuzzing target.
# =============================================================================

# ---- Listener ----------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt
socket_domain ipv4

# ---- Authentication ----------------------------------------------------------
# Disable all authentication so the fuzzer can connect freely
allow_anonymous true

# ---- Persistence -------------------------------------------------------------
persistence true
persistence_location /var/lib/mosquitto/

# ---- Logging -----------------------------------------------------------------
# Verbose logging to stderr (visible in docker logs)
log_dest stderr
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# ---- Limits tuned for fuzzing ------------------------------------------------
# Keep memory bounded while allowing enough concurrent connections
max_connections 50
max_inflight_messages 20
max_queued_messages 100
message_size_limit 1048576
max_keepalive 120

# ---- No TLS (fuzzing cleartext) ---------------------------------------------
# TLS is disabled to allow raw protocol fuzzing without certificate overhead

# ---- Plugin loading ----------------------------------------------------------
# No auth plugins — rely on allow_anonymous
